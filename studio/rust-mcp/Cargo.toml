[package]
name = "jk-studio-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-io", "client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
