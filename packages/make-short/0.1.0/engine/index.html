<!doctype html>
<html><head><meta charset="utf-8"><title>The Longest Fall</title>
<style>
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:JBM;font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:JBM;font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
#out{display:block;width:1920px;height:1920px}
</style></head>
<body><canvas id="out" width="1920" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"./three/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { createComposer } from './core/compose.js';
await Promise.all(['700 100px Inter', '500 60px Inter', '500 40px JBM', '400 40px JBM'].map(f => document.fonts.load(f)));
const C = await createComposer({ THREE, canvas: document.getElementById('out') });
window.setF = (f, o) => { C.renderFrame(f, o || {}); return true; };
window.READY = true;
C.renderFrame(0, {});
</script></body></html>
