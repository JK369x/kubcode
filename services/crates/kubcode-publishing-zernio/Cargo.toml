[package]
name = "kubcode-publishing-zernio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Zernio adapter for the publishing core (docs/design/publishing-core.md §5)"

[dependencies]
kubcode-publishing = { path = "../kubcode-publishing" }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
kubcode-publishing = { path = "../kubcode-publishing", features = ["contract"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
