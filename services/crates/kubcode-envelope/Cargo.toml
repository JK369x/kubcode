[package]
name = "kubcode-envelope"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Envelope v1 for kubcode per-user secrets (see docs/design/settings-keys.md)"

[features]
# Unwraps DEKs with a local RSA private key. For tests and local fixtures
# only: production unwraps through KMS (kms:Decrypt) in the Lambda crates.
local-unwrap = []

[dependencies]
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kubcode-envelope = { path = ".", features = ["local-unwrap"] }
