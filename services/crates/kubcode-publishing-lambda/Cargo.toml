[package]
name = "kubcode-publishing-lambda"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Publishing Lambda: web-host API, Zernio webhooks and the owner's ops commands (docs/design/publishing-core.md §4)"

[lib]
name = "publishing_lambda"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
kubcode-publishing = { path = "../kubcode-publishing" }
kubcode-publishing-store = { path = "../kubcode-publishing-store" }
kubcode-publishing-zernio = { path = "../kubcode-publishing-zernio" }
kubcode-oauth-connect = { path = "../kubcode-oauth-connect" }
async-trait = "0.1"
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
bytes = "1"
futures = "0.3"
hex = "0.4"
lambda_http = { version = "1", default-features = false, features = ["apigw_http"] }
lambda_runtime = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
kubcode-publishing = { path = "../kubcode-publishing", features = ["contract"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
