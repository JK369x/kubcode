[package]
name = "kubcode-publishing-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Postgres store for the publishing core (db/migrations/0007-0008, docs/design/publishing-core.md §8)"

[dependencies]
kubcode-publishing = { path = "../kubcode-publishing" }
thiserror = "2"
time = "0.3"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
