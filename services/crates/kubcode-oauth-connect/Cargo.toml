[package]
name = "kubcode-oauth-connect"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OAuth connect Lambda: code exchange, token sealing, revoke (docs/design/settings-keys.md §2)"

[lib]
name = "oauth_connect"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
kubcode-envelope = { path = "../kubcode-envelope" }
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
lambda_http = { version = "1", default-features = false, features = ["apigw_http"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tokio-postgres-rustls = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
kubcode-envelope = { path = "../kubcode-envelope", features = ["local-unwrap"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
