[package]
name = "kubcode-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The owner's kubcode CLI: push a clip from ~/Studio, schedule it, check it (docs/design/publishing-core.md §10)"

[lib]
name = "kubcode_cli"
path = "src/lib.rs"

[[bin]]
name = "kubcode"
path = "src/main.rs"

[dependencies]
kubcode-publishing = { path = "../kubcode-publishing" }
kubcode-publishing-lambda = { path = "../kubcode-publishing-lambda" }
hex = "0.4"
# Cover check: decode YouTube thumbnails (JPEG) and our cover (JPEG/PNG).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
