[package]
name = "kubcode-billing-lambda"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Billing Lambda: Stripe Checkout month pass, Stripe webhooks, idempotent fulfilment (ADR 0008)"

[lib]
name = "billing_lambda"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
kubcode-billing = { path = "../kubcode-billing" }
kubcode-billing-store = { path = "../kubcode-billing-store" }
kubcode-oauth-connect = { path = "../kubcode-oauth-connect" }
async-trait = "0.1"
hex = "0.4"
hmac = "0.12"
lambda_http = { version = "1", default-features = false, features = ["apigw_http"] }
lambda_runtime = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
