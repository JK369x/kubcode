[package]
name = "kubcode-package-signer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Presigns short-lived S3 GET URLs for kubcode skill packages (see docs/design/package-signer.md)"

# Not part of any workspace: this crate builds and ships on its own.
[workspace]

[lib]
name = "package_signer"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
hex = "0.4"
hmac = "0.12"
lambda_http = { version = "1", default-features = false, features = ["apigw_http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
