# Every push to a non-main branch: the shared checks (tests, types, build).
# No preview deployment: production moved off Vercel to Lightsail
# (docs/adr/0001-host-web-on-lightsail.md); review UI changes locally.
#
# Trust boundary: repository secrets (MIGRATION_DATABASE_URL,
# LIGHTSAIL_DEPLOY_KEY) are readable by any branch's workflow, so anyone who
# can push a branch can reach production. Only the owner has push access;
# keep it that way (see HANDOFF.md section 7a).
name: Preview

on:
  push:
    branches-ignore:
      - main
    # Infra/docs-only changes skip the app checks; infra/ has its own Infra
    # workflow. docs/covers* still triggers because tests/cover-brief.test.ts
    # reads it. Later patterns override earlier ones.
    paths:
      - "**"
      - ".github/**"
      - "!infra/**"
      - "!.github/workflows/infra.yml"
      - "!docs/**"
      - "docs/covers.md"
      - "docs/covers/**"
      - "!*.md"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
