# Every push to a non-main branch: checks, then a Vercel PREVIEW deployment
# built in CI (prebuilt) and linked on the branch's open PR. Never migrates and
# never touches production.
name: Preview

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: "54.1.0"
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  preview:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull preview project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: Build (prebuilt, licensed-only media)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_MEDIA_MODE: licensed-only
        run: vercel build --target=preview --token "$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --target=preview --token "$VERCEL_TOKEN")
          host=${url#https://}
          # An untargeted first deploy once became production: always verify.
          target=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}" | jq -r '.target // "preview"')
          if [ "$target" = "production" ]; then
            echo "::error::preview deploy returned a PRODUCTION deployment ($url); investigate before merging"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url (target=$target)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the open PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH; preview URL is in the run summary."
            exit 0
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
            --body "Preview for \`${SHA:0:7}\`: $URL (no migrations run; preview has no production secrets)"
