# Reusable quality gate for every branch: unit tests, types, production build
# and the real-PostgreSQL accounts suite against a throwaway service container.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      # Studio engine (studio/): node:test + manifest check, no install and no
      # local media needed (media-dependent tests skip; docs/adr/0005).
      - run: npm --prefix studio test
      - run: npm --prefix studio run check
      # Source-only build: private preview binaries are intentionally not in Git.
      - run: npm run build
        env:
          NEXT_PUBLIC_MEDIA_MODE: licensed-only

  accounts-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kubcode_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kubcode_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # Loopback fixture database only; never a hosted URL.
      - run: npm run test:accounts-db
        env:
          KUBCODE_TEST_DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/kubcode_ci_test

  # Rust workspace in services/: the envelope crate and the OAuth connect
  # Lambda (docs/design/settings-keys.md §2). The DB flow tests run against a
  # throwaway Postgres; the musl build proves the deployable zip.
  rust-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_TOOLCHAIN: "1.94.1"
    defaults:
      run:
        working-directory: services
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: kubcode_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kubcode_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and musl tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy \
            --target x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
          bash "$GITHUB_WORKSPACE/.github/scripts/install-musl-gcc.sh"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Loopback fixture database only; --include-ignored runs the DB tests too.
      - run: cargo test --workspace --locked -- --include-ignored
        env:
          KUBCODE_TEST_DATABASE_URL: postgres://postgres:fixture-only@127.0.0.1:5432/kubcode_ci_test
      - run: bash crates/kubcode-oauth-connect/build-lambda.sh
      - run: unzip -Z crates/kubcode-oauth-connect/dist/bootstrap.zip | grep -E '^-rwx.*bootstrap$'
      - run: bash crates/kubcode-publishing-lambda/build-lambda.sh
      - run: unzip -Z crates/kubcode-publishing-lambda/dist/bootstrap.zip | grep -E '^-rwx.*bootstrap$'

  # Rust presign Lambda (docs/design/package-signer.md). Also proves the musl
  # release build and the deployable zip, so a broken build never reaches infra.
  signer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUST_TOOLCHAIN: "1.94.1"
    defaults:
      run:
        working-directory: services/package-signer
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and musl tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy \
            --target x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
          bash "$GITHUB_WORKSPACE/.github/scripts/install-musl-gcc.sh"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: ./build-lambda.sh
      # Lambda needs the executable bit inside the zip (Pulumi uploads it as-is).
      - run: unzip -Z dist/bootstrap.zip | grep -E '^-rwx.*bootstrap$'
