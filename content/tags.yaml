# Every tag used in content/ is defined here once (lower-kebab slug).
# th/en are display labels; description shows on the tag page.
video-pipeline:
  th: ขั้นตอนทำวิดีโอ
  en: Video pipeline
  description: แต่ละชั้นของงานวิดีโอ ตั้งแต่บท สไตล์ ผู้เขียน renderer เสียง และซับ
renderer:
  th: ตัว render
  en: Renderer
  description: เครื่องมือที่สร้างภาพและ export วิดีโอ เช่น Remotion, HyperFrames หรือ Canvas
setup:
  th: ติดตั้งและเตรียมเครื่อง
  en: Setup
  description: สิ่งที่เครื่องต้องมีก่อนเริ่ม และวิธีทดสอบเล็ก ๆ ก่อนใช้งานจริง
licensing:
  th: สิทธิ์และไลเซนส์
  en: Licensing
  description: สิทธิ์ใช้งานและแจกจ่ายของโค้ด ภาพ เสียง ฟอนต์ และบริการภายนอก
animation:
  th: แอนิเมชัน
  en: Animation
  description: ทำแอนิเมชันด้วยโค้ดและ AI ตั้งแต่เขียนฉากเป็น SVG จนเรนเดอร์เป็นวิดีโอ
ai-agent:
  th: AI agent และโมเดล
  en: AI agents & models
  description: ผู้ช่วยเขียนโค้ดและโมเดลภาษาที่สั่งงานผ่าน skill เพื่อสร้างคลิป
free-tier:
  th: ใช้ฟรี
  en: Free tier
  description: เครื่องมือที่เริ่มใช้ได้ฟรี พร้อมเงื่อนไขที่ต้องอ่านก่อนเผยแพร่หรือหารายได้
voice:
  th: เสียงพากย์
  en: Voice
  description: เสียงบรรยายและเสียงประกอบ ทั้งบริการออนไลน์และโมเดลที่รันในเครื่อง
3d:
  th: 3D
  en: 3D
  description: ฉากและตัวละคร 3 มิติที่สร้างด้วยโค้ด เช่น Blender หรือ Three.js
spec-design:
  th: ออกแบบก่อนเขียนโค้ด
  en: Spec & design
  description: เขียนสเปกและเอกสารออกแบบให้ครบก่อนให้ AI ลงมือสร้าง แล้วรีวิวด้วยตาใหม่
